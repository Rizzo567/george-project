<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <!-- Security headers -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'">
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">

  <title>Prenotazione Confermata — MISTER BARBER</title>

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/img/mister-barber-logo.png">
  <link rel="apple-touch-icon" href="assets/img/mister-barber-logo.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&family=Bebas+Neue&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">

  <style>
    .mb-link:hover{color:#EA6934!important}
    .mb-cta:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(234,105,52,.35)}
    .conferma-page .conferma-main{padding-top:40px!important}
    .conferma-page {
      background: var(--asphalt);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .conferma-main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: calc(var(--nav-height) + 60px) var(--page-margin) 80px;
    }

    /* ─── INNER WRAPPER ─── */
    .conferma-inner {
      width: 100%;
      max-width: 900px;
      opacity: 0;
      animation: conf-appear 0.65s cubic-bezier(0.34,1.2,0.64,1) 0.15s forwards;
    }
    @keyframes conf-appear {
      from { opacity: 0; transform: translateY(28px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ─── TOP: CHECK + LABEL (centrati) ─── */
    .conf-top {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 52px;
    }

    .conf-check {
      width: 64px;
      height: 64px;
      background: #27ae60;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 20px;
    }
    .conf-check svg { width: 32px; height: 32px; }
    .conf-check-path {
      fill: none;
      stroke: white;
      stroke-width: 3.5;
      stroke-linecap: round;
      stroke-linejoin: round;
      stroke-dasharray: 50;
      stroke-dashoffset: 50;
      animation: draw-check 0.4s ease 0.45s forwards;
    }
    @keyframes draw-check { to { stroke-dashoffset: 0; } }

    .conf-label {
      font-family: var(--font-body);
      font-weight: 500;
      font-size: var(--eyebrow);
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: #27ae60;
      text-align: center;
    }

    /* ─── BOTTOM: TESTO SINISTRA + IMMAGINE DESTRA ─── */
    .conf-body {
      display: flex;
      align-items: center;
      gap: 48px;
    }

    /* Testo */
    .conf-text {
      flex: 1;
      min-width: 0;
    }

    .conf-barber-name {
      font-family: var(--font-display);
      font-size: clamp(64px, 11vw, 120px);
      line-height: 0.9;
      text-transform: uppercase;
      color: var(--ember);
      margin-bottom: 4px;
    }

    .conf-ti-aspetta {
      font-family: var(--font-display);
      font-size: clamp(40px, 7vw, 72px);
      line-height: 1;
      text-transform: uppercase;
      color: var(--canvas);
      margin-bottom: 20px;
    }

    .conf-detail {
      font-family: var(--font-body);
      font-size: clamp(16px, 2.5vw, 20px);
      color: var(--canvas-soft);
      letter-spacing: 0.04em;
      line-height: 1.7;
    }
    .conf-detail strong {
      color: var(--canvas);
      font-weight: 600;
    }

    /* Immagine */
    .conf-img {
      flex-shrink: 0;
      width: clamp(180px, 28vw, 320px);
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .conf-img img {
      width: 100%;
      height: auto;
      display: block;
      filter: drop-shadow(0 20px 40px rgba(0,0,0,0.5));
    }

    /* ─── CTA ─── */
    .conf-cta {
      margin-top: 52px;
    }
    .conf-btn {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 1.5px solid rgba(229,225,216,0.2);
      color: var(--silver);
      font-family: var(--font-body);
      font-size: var(--body-s);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      padding: 13px 26px;
      text-decoration: none;
      transition: border-color 0.2s, color 0.2s;
    }
    .conf-btn:hover {
      border-color: var(--ember);
      color: var(--ember);
    }

    /* ─── RESPONSIVE ─── */
    @media (max-width: 600px) {
      .conferma-main {
        padding: calc(var(--nav-height) + 40px) 20px 60px;
        align-items: flex-start;
      }
      .conf-top { align-items: flex-start; }
      .conf-body {
        gap: 24px;
        align-items: flex-start;
      }
      .conf-img {
        width: clamp(100px, 32vw, 160px);
        flex-shrink: 0;
      }
      .conf-barber-name { font-size: clamp(44px, 13vw, 72px); }
      .conf-ti-aspetta  { font-size: clamp(28px, 9vw, 48px); }
    }
  </style>
</head>
<body class="conferma-page">

  <!-- HEADER — uguale alla home (index.html) -->
  <header class="mb-header" style="position:sticky;top:0;z-index:60;background:transparent">
    <div style="max-width:1240px;margin:0 auto;padding:0 24px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center">
      <span></span>
      <a href="/" style="justify-self:center">
        <img src="assets/img/logo.png" alt="Mister Barber" style="display:block;height:clamp(150px,15vw,190px);width:auto;margin:-32px 0 -24px" />
      </a>
      <div style="justify-self:end;display:flex;align-items:center;gap:16px">
        <a href="prenota.html" class="mb-cta" style="background:#EA6934;color:#0B0B0B;font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:12px 22px;border-radius:99px;text-decoration:none;transition:transform .25s ease,box-shadow .25s ease">Prenota ora</a>
        <button id="mbOpenNav" aria-label="Apri il menu" style="display:flex;flex-direction:column;gap:5px;background:transparent;border:0;cursor:pointer;padding:10px">
          <span style="display:block;width:22px;height:2px;background:#D4D0CA;border-radius:2px"></span>
          <span style="display:block;width:22px;height:2px;background:#D4D0CA;border-radius:2px"></span>
          <span style="display:block;width:22px;height:2px;background:#D4D0CA;border-radius:2px"></span>
        </button>
      </div>
    </div>
  </header>
  <div id="mbScrim" style="position:fixed;inset:0;z-index:70;background:rgba(11,11,11,.62);opacity:0;pointer-events:none;transition:opacity .34s ease"></div>
  <aside id="mbPanel" style="position:fixed;top:0;right:0;bottom:0;z-index:80;width:min(86vw,350px);background:#1a1c1d;border-left:1px solid rgba(212,208,202,.12);padding:0 26px 34px;display:flex;flex-direction:column;gap:22px;transform:translateX(105%);transition:transform .38s cubic-bezier(.2,.7,.3,1);box-shadow:-24px 0 60px rgba(0,0,0,.5)">
    <div style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;margin:0 -26px;padding:0 24px">
      <span></span>
      <img src="assets/img/logo.png" alt="Mister Barber" style="display:block;justify-self:center;height:clamp(150px,15vw,190px);width:auto;margin:-32px 0 -24px" />
      <button id="mbCloseNav" aria-label="Chiudi il menu" style="justify-self:end;background:transparent;border:0;cursor:pointer;padding:8px;font-family:system-ui,sans-serif;font-size:26px;line-height:1;color:#D4D0CA">&times;</button>
    </div>
    <nav style="display:flex;flex-direction:column;gap:16px">
      <a href="/#barbiere" class="mb-link" style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:.04em;color:#D4D0CA;padding:6px 0;transition:color .2s ease;text-decoration:none">Il barbiere</a>
      <a href="/#servizi" class="mb-link" style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:.04em;color:#D4D0CA;padding:6px 0;transition:color .2s ease;text-decoration:none">Servizi</a>
      <a href="/#video" class="mb-link" style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:.04em;color:#D4D0CA;padding:6px 0;transition:color .2s ease;text-decoration:none">Video</a>
      <a href="/#recensioni" class="mb-link" style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:.04em;color:#D4D0CA;padding:6px 0;transition:color .2s ease;text-decoration:none">Recensioni</a>
      <a href="/#contatti" class="mb-link" style="font-family:'Bebas Neue',sans-serif;font-size:34px;line-height:1;letter-spacing:.04em;color:#D4D0CA;padding:6px 0;transition:color .2s ease;text-decoration:none">Contatti</a>
    </nav>
    <div style="margin-top:8px;display:flex;flex-direction:column;gap:16px">
      <a href="prenota.html" style="background:#EA6934;color:#0B0B0B;font-family:'Barlow',sans-serif;font-weight:700;font-size:12px;letter-spacing:.14em;text-transform:uppercase;padding:14px 20px;border-radius:99px;text-align:center;text-decoration:none">Prenota ora</a>
    </div>
  </aside>

  <main class="conferma-main">
    <div class="conferma-inner">

      <!-- CHECK + LABEL centrati -->
      <div class="conf-top">
        <div class="conf-check">
          <svg viewBox="0 0 50 40">
            <polyline class="conf-check-path" points="4,20 18,34 46,4"/>
          </svg>
        </div>
        <p class="conf-label">Prenotazione confermata</p>
      </div>

      <!-- TESTO SX + IMMAGINE DX -->
      <div class="conf-body">

        <div class="conf-text">
          <p class="conf-barber-name" id="confName">—</p>
          <p class="conf-ti-aspetta">Ti aspetta</p>
          <p class="conf-detail" id="confDetail">—</p>
        </div>

        <div class="conf-img">
          <img id="confThumb" src="" alt="">
        </div>

      </div>

      <div class="conf-cta">
        <a href="/" class="conf-btn">← Torna alla home</a>
      </div>

    </div>
  </main>

  <script>
    (function () {
      var MONTHS = ['gennaio','febbraio','marzo','aprile','maggio','giugno',
                    'luglio','agosto','settembre','ottobre','novembre','dicembre'];
      var DAYS   = ['domenica','lunedì','martedì','mercoledì','giovedì','venerdì','sabato'];

      var raw = sessionStorage.getItem('mbooking');
      var validBarber = false, validDate = false, validTime = false;
      var b = null;
      try {
        b = raw ? JSON.parse(raw) : null;
        if (b && typeof b === 'object') {
          validBarber = b.barber === 'berlin';
          validDate   = typeof b.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(b.date);
          validTime   = typeof b.time === 'string' && /^([01]\d|2[0-3]):[0-5]\d$/.test(b.time);
        }
      } catch (e) { b = null; }

      if (b && validBarber && validDate && validTime) {
        var name = 'Berlin';
        var d    = new Date(b.date + 'T12:00:00');
        var dateStr = DAYS[d.getDay()] + ' ' + d.getDate() + ' ' + MONTHS[d.getMonth()];

        // SECURITY: usa textContent / createElement invece di innerHTML con valori
        document.getElementById('confName').textContent = name;
        var detail = document.getElementById('confDetail');
        detail.textContent = ''; // clear
        var strong1 = document.createElement('strong');
        strong1.textContent = dateStr;
        detail.appendChild(strong1);
        detail.appendChild(document.createElement('br'));
        detail.appendChild(document.createTextNode('alle '));
        var strong2 = document.createElement('strong');
        strong2.textContent = b.time;
        detail.appendChild(strong2);

        var thumbMap = {
          berlin: 'assets/img/berlin-thumb.png'
        };
        document.getElementById('confThumb').src = thumbMap[b.barber];
        document.getElementById('confThumb').alt = name;

        sessionStorage.removeItem('mbooking');
      } else {
        document.getElementById('confName').textContent  = 'Grazie';
        document.getElementById('confDetail').textContent = 'Ti contatteremo presto.';
        // Un solo barbiere: Berlin si vede anche senza dati di prenotazione
        // (pagina aperta direttamente o ricaricata).
        document.getElementById('confThumb').src = 'assets/img/berlin-thumb.png';
        document.getElementById('confThumb').alt = 'Berlin';
      }

      // Menu laterale (come in home)
      var panel = document.getElementById('mbPanel'), scrim = document.getElementById('mbScrim');
      function setNav(open) {
        panel.style.transform = open ? 'translateX(0)' : 'translateX(105%)';
        scrim.style.opacity = open ? '1' : '0';
        scrim.style.pointerEvents = open ? 'auto' : 'none';
      }
      document.getElementById('mbOpenNav').addEventListener('click', function () { setNav(true); });
      document.getElementById('mbCloseNav').addEventListener('click', function () { setNav(false); });
      scrim.addEventListener('click', function () { setNav(false); });
      panel.querySelectorAll('a').forEach(function (a) { a.addEventListener('click', function () { setNav(false); }); });
    })();
  </script>

</body>
</html>
